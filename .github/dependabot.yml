# Alertes et mises à jour, une PR par semaine et par écosystème, vers main.
# Chaque PR se relit et passe la CI : une dépendance se valide (pawnote et jsqr sont embarqués dans main.js).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
