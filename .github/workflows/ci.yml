# Contrôles à chaque PR et à chaque push sur main. Réduits à la pile du plugin.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jeton minimal : la CI ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Failles connues de ce qui est embarqué dans main.js (pawnote, jsqr)
        run: npm audit --omit=dev --audit-level=high
      - name: Typage, absence de any, tests, build
        run: npm run check

  secrets:
    # Programme gitleaks (licence MIT) en version fixe, somme de contrôle vérifiée ; pas gitleaks-action (licence non MIT).
    name: Contrôle des secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Rechercher les secrets (tout l'historique)
        run: ./gitleaks git --redact --no-banner -v .
